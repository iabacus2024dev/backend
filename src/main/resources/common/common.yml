spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 500
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

  session:
    timeout: 86400 # 24h

logging:
  level:
    kr.co.iabacus.sales: debug

base:
  url: ${LOCAL_BASE_URL}

server:
  servlet:
    session:
      cookie:
        max-age: 172800 # 48h
